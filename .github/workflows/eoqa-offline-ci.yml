name: EOQA offline validation

on:
  push:
    branches: [main]
    paths:
      - "eoqa/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/eoqa-offline-ci.yml"
  pull_request:
    paths:
      - "eoqa/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/eoqa-offline-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eoqa-offline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run offline unit and integration tests
        run: python -m unittest discover -s tests -v
      - name: Regenerate synthetic raster outputs
        run: python -m eoqa.demo --mode offline --out output/offline
